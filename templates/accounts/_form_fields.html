{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}
    {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
  </div>
{% endfor %}
